version: "3.8"

# =============================================================================
# docker-compose.yaml — Infrastructure Services
# =============================================================================
# PURPOSE:
#   Spins up two external services that the RAG app depends on:
#     1. MongoDB  — stores project metadata + raw text chunks
#     2. Qdrant   — stores embedding vectors for semantic search
#
# HOW TO USE (from the /docker folder in PowerShell / CMD):
#   docker-compose up -d          ← start both services in background
#   docker-compose down           ← stop and remove containers
#   docker-compose logs -f        ← stream live logs from both
#
# PORTS EXPOSED TO YOUR MACHINE:
#   MongoDB → localhost:27007
#   Qdrant  → localhost:6333  (REST API)
#             localhost:6334  (gRPC – optional)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # SERVICE 1: MongoDB
  # ---------------------------------------------------------------------------
  # What it stores:
  #   - "projects" collection: one document per project (project_id)
  #   - "chunks"   collection: all text chunks produced by ProcessController
  #
  # Credentials come from the .env file in this same /docker folder.
  # Data is persisted in the ./mongodb folder so it survives container restarts.
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: rag_mongodb
    restart: always
    ports:
      - "27007:27017"           # host:container — we use 27007 to avoid clash with any local mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./mongodb:/data/db      # persists data on your disk under docker/mongodb/

  # ---------------------------------------------------------------------------
  # SERVICE 2: Qdrant (Vector Database)
  # ---------------------------------------------------------------------------
  # What it stores:
  #   - One collection per project: "collection_<project_id>"
  #   - Each point = one chunk embedding (384-dim float vector) + text payload
  #
  # UI dashboard available at: http://localhost:6333/dashboard
  # Storage is persisted in src/assets/db/qdrant_data on your disk.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: always
    ports:
      - "6333:6333"             # REST API
      - "6334:6334"             # gRPC
    volumes:
      - ../src/assets/db/qdrant_data:/qdrant/storage   # persists vectors on disk
