services:
  # backend
  rag_app:
    build: 
      context: ../src
      dockerfile: Dockerfile
    container_name: rag_fastapi_backend
    restart: always
    ports:
      - "5000:5000"
    env_file: ../src/.env
    depends_on:
      - mongodb
      - qdrant
    volumes:
      - ../src:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  mongodb:
    image: mongo:7.0
    container_name: rag_mongodb
    restart: always
    ports:
      - "27007:27017"           # host:container — we use 27007 to avoid clash with any local mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./mongodb:/data/db      # persists data on your disk under docker/mongodb/
    
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: always
    ports:
      - "6333:6333"             # REST API
      - "6334:6334"             # gRPC
    volumes:
      - ../src/assets/db/qdrant_data:/qdrant/storage   # persists vectors on disk
    
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
   
